<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="app">
        <div class="container mt-5">
            <div class="row">
                <div class="col text-center">
                    <h1>ToDo List</h1>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-center mt-5">
                        <div class="container-todo">
                            <div class="p-4">
                                <ul class="list-unstyled">
                                    <li v-for="(item, index) in todoList">
                                        <div class="d-flex justify-content-between my-3">
                                            <div :class="(item.done) ?'line-through' : ''">
                                                {{index+1}} - {{item.text}}
                                            </div>
                                            <div>
                                                <button @click="deleteTask(index)" class="btn btn-danger">
                                                    <i class="fa-solid fa-x"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class=" col-12">
                    <div class="d-flex justify-content-center mt-3">
                        <input v-model="newTask" class="form-control w-50" type="text"
                            placeholder="Inserici nuova todo">
                        <button @click="addTask" class="mx-3 btn btn-primary">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- VUE JS -->

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- JS -->
    <script type="text/javascript" src="./js/script.js"></script>
</body>

</html>
